name: todopod
description: "Task Management with Secure and Private Storage"
publish_to: 'none'
version: 0.1.25+3

environment:
  sdk: ^3.11.3

dependencies:
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  gap: ^3.0.1
  markdown_tooltip: ^0.0.10
  pdf: ^3.11.1
  printing: ^5.13.1
  provider: ^6.1.5
  solidpod: ^0.12.4
  solidui: ^0.3.24
  table_calendar: ^3.1.3
  uuid: ^4.5.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  assets:
    - assets/images/app_icon.png
    - assets/images/app_image.jpg
  uses-material-design: true

# Define launcher icons for all platforms (except Linux) so icons for
# the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`
#
# (gjw 20250429)

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
