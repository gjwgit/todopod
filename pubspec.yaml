name: todopod
description: "Todo Pod - Task Management with Secure and Private Storage"
publish_to: 'none'
version: 1.0.21+4

environment:
  sdk: ^3.11.3

# 20250722 gjw To automatically upgrade package dependencies:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter

  # Graham's own text field with Emacs-style keybindings, used for the task
  # notes editor in TASKS, DONE and the task edit dialog.
  emacs_text_field: ^0.1.3

  # Pick a Todo.txt/JSON file to import and choose a save location to export
  # to, in the IMPORT/EXPORT screen.
  file_picker: ^11.0.2

  # Small fixed-size spacing widget, used throughout the layout in place of
  # bare SizedBoxes.
  gap: ^3.0.1

  # Graham's own drop-in Tooltip replacement with Markdown rendering and a
  # popup delay, used for every tooltip in the app.
  markdown_tooltip: ^0.0.10

  # Render Markdown-formatted task notes in the DONE list and the task edit
  # dialog.
  flutter_markdown_plus: ^1.0.7

  # Build the PDF document for the BACKUP/EXPORT "save as PDF" option.
  pdf: ^3.11.1

  # Preview and share the exported PDF from the IMPORT/EXPORT screen.
  printing: ^5.13.1

  # State management: AppProvider is a ChangeNotifier read/watched via
  # provider throughout the screens.
  provider: ^6.1.5

  # Device-local display preferences (ViewPrefs), never synced to the Pod.
  shared_preferences: ^2.3.0

  # Solid Pod storage and encryption: read/write the encrypted todo/done
  # files on the user's Pod.
  solidpod: ^1.0.13

  # Solid app scaffold, login flow, and shared settings/about UI.
  solidui: ^1.0.27

  # Calendar grid widget backing the PLANNER screen.
  table_calendar: ^3.1.3

  # Generate stable unique identifiers for each task.
  uuid: ^4.5.3

  # Restore the last window size/position on Linux/macOS/Windows desktop.
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the platform launcher icons from assets/images/app_icon.png.
  # Re-run after changing the icon: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - assets/images/app_icon.png
    - assets/images/app_image.jpg
  uses-material-design: true

# 20250429 gjw Define launcher icons for all platforms (except Linux)
# so icons for the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
